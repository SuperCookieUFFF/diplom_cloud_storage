server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://db:5432/file_service
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  sql:
    init:
      mode: never


logging:
  level:
    spingcloud.diplom: INFO
    spingcloud.diplom.service: DEBUG
    spingcloud.diplom.controller: INFO
    spingcloud.diplom.security: DEBUG
    org.springframework: WARN
    org.hibernate: WARN
    org.apache: WARN
  file:
    name: logs/cloud-storage.log
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

app:
  file-storage:
    location: /app/uploads
  jwt:
    secret: mySecretKeyForJWTTokenGenerationInFileServiceApplication2024
    expiration: 86400000